name: Deploy to VPS

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,EMAILJS_PUBLIC_KEY
          script: |
            cd /opt/egwimcodes
            git pull origin master

            docker stop egwimcodes || true
            docker rm egwimcodes || true

            docker build \
              --build-arg NEXT_PUBLIC_EMAILJS_SERVICE_ID="$EMAILJS_SERVICE_ID" \
              --build-arg NEXT_PUBLIC_EMAILJS_TEMPLATE_ID="$EMAILJS_TEMPLATE_ID" \
              --build-arg NEXT_PUBLIC_EMAILJS_PUBLIC_KEY="$EMAILJS_PUBLIC_KEY" \
              -t egwimcodes .
            docker run -d \
              --name egwimcodes \
              --restart unless-stopped \
              --network intellanex-public \
              --label "traefik.enable=true" \
              --label "traefik.docker.network=intellanex-public" \
              --label "traefik.http.routers.egwimcodes.entrypoints=websecure" \
              --label "traefik.http.routers.egwimcodes.middlewares=secure-chain@file" \
              --label "traefik.http.routers.egwimcodes.rule=Host(\`egwimcodes.dev\`) || Host(\`www.egwimcodes.dev\`)" \
              --label "traefik.http.routers.egwimcodes.tls.certresolver=letsencrypt" \
              --label "traefik.http.services.egwimcodes.loadbalancer.server.port=3000" \
              egwimcodes
        env:
          EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
